server:
  port: 8081

systar:
  database:
    type: mysql
  security:
    secret: ${SYSTAR_SECRET:changeme-default-secret}
    whitelist: /actuator/health,/error,/api/auth/login,/api/auth/logout,/api/sys/notice/active
  statistics:
    aggregation-interval-ms: 300000
    max-catch-up-hours: 168
  stats-datasource:
    url: jdbc:mysql://localhost:3306/db_systar_stats?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: systar
    password: ${SYSTAR_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_systar?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: systar
    password: ${SYSTAR_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

logging:
  level:
    com.systar: DEBUG

---
# Development profile — H2 in-memory database
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:db_systar;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: file:sql/h2/ddl/01-core.sql,file:sql/h2/ddl/02-ops.sql,file:sql/h2/ddl/03-system.sql
      data-locations: file:sql/h2/data/01-init.sql,file:sql/h2/data/03-simulator.sql

systar:
  database:
    type: h2
  statistics:
    aggregation-interval-ms: 300000
    max-catch-up-hours: 168
  stats-datasource:
    url: jdbc:h2:mem:db_systar_stats;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
