server:
  port: 8081

# 白名单的运维探活端点：只暴露 health，不暴露 env/metrics 等，安全面最小
management:
  endpoints:
    web:
      exposure:
        include: health

systar:
  database:
    type: mysql
  security:
    secret: ${SYSTAR_SECRET:changeme-default-secret}
    whitelist: /actuator/health,/error,/api/auth/login,/api/auth/logout,/api/sys/notice/active
  statistics:
    aggregation-interval-ms: 300000
    max-catch-up-hours: 168
  stats-datasource:
    url: jdbc:mysql://localhost:3306/db_systar_stats?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: systar
    password: ${SYSTAR_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_systar?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: systar
    password: ${SYSTAR_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

logging:
  level:
    com.systar: DEBUG

---
# Development profile — H2 file database (persistent across restarts, so
# history-dependent features — trend/candlestick/aggregation catch-up — have
# real data to show). Files live under gitignored temp/data/; delete that
# directory to reset. Schema/data init scripts are idempotent (IF NOT EXISTS
# + MERGE INTO), so every startup re-merges seed rows to canonical values
# while runtime-collected samples and user edits of non-seed rows accumulate.
# Full-context tests override both URLs back to in-memory (test resources
# application-dev.yml) to keep test isolation.
# Windows winnat 动态端口保留段可能覆盖基础配置的 8081（bind 失败但无监听进程），
# dev 改用 10000 以上非知名端口规避；生产部署不受影响，仍用基础配置 8081。
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./temp/data/db_systar;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: file:sql/h2/ddl/01-core.sql,file:sql/h2/ddl/02-ops.sql,file:sql/h2/ddl/03-system.sql
      data-locations: file:sql/h2/data/01-init.sql,file:sql/h2/data/03-simulator.sql

server:
  port: 18081

systar:
  database:
    type: h2
  # dev 运行从构建产物插件目录加载驱动（fat jar 已不含驱动类）
  drivers:
    path: ./drivers/dist
  statistics:
    aggregation-interval-ms: 300000
    max-catch-up-hours: 168
  stats-datasource:
    url: jdbc:h2:file:./temp/data/db_systar_stats;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
