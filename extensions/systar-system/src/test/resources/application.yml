spring:
  datasource:
    url: jdbc:h2:mem:db_systar;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: file:sql/h2/ddl/01-core.sql,file:sql/h2/ddl/02-ops.sql,file:sql/h2/ddl/03-system.sql
      data-locations: file:sql/h2/data/01-init.sql

systar:
  database:
    type: h2
  security:
    secret: test-secret-key-for-jwt-signing
    whitelist: /actuator/health,/error,/api/auth/login,/api/auth/logout
